<!doctype html>
<html lang="en" style="background: black">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Analysis - Reports Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-color: #ffffff;
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --danger-color: #ef4444;
        --dark-bg: #000000;
        --dark-surface: #0a0a0a;
        --dark-border: #222222;
        --dark-text: #d4d4d4;
        --dark-text-muted: #999999;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: #000000;
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        color: var(--dark-text);
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .main-container {
        background: #000000;
        margin: 0 auto;
        padding: 10px;
        max-width: 1200px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 15px;
        background: #0a0a0a;
        border-radius: 8px;
        border: 1px solid var(--dark-border);
        margin-bottom: 10px;
        flex-shrink: 0;
      }

      .header-title {
        color: #d4d4d4;
        font-size: 1.4rem;
        font-weight: 600;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        line-height: 1;
      }

      .yesterday-icon {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: #1a1a1a;
        border: 1px solid var(--dark-border);
        border-radius: 6px;
        color: #d4d4d4;
        text-decoration: none;
        transition: all 0.2s ease;
        font-size: 1rem;
      }

      .yesterday-icon:hover {
        background: #222222;
        color: #d4d4d4;
      }

      .yesterday-icon i {
        font-size: 1.2rem;
      }



      .calendar-section {
        background: #0a0a0a;
        border-radius: 8px;
        padding: 10px;
        border: 1px solid var(--dark-border);
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      .calendar-header {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--dark-border);
        flex-shrink: 0;
      }

      .calendar-nav {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .nav-btn {
        background: #1a1a1a;
        border: 1px solid var(--dark-border);
        color: #d4d4d4;
        padding: 6px 12px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 1rem;
      }

      .nav-btn:hover {
        background: #222222;
      }

      .month-year {
        font-size: 1.3rem;
        font-weight: 600;
        color: #d4d4d4;
        min-width: 160px;
        text-align: center;
        line-height: 1;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-template-rows: auto repeat(6, 1fr);
        gap: 4px;
        width: 100%;
        max-width: 100%;
        flex: 1;
        overflow: hidden;
      }

      .calendar-day-header {
        text-align: center;
        font-weight: 600;
        color: var(--dark-text-muted);
        padding: 6px 4px;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .calendar-day {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
        transition: all 0.2s ease;
        position: relative;
        font-weight: 500;
        background: #1a1a1a;
        border: 1px solid transparent;
        color: #d4d4d4;
        text-decoration: none;
        font-size: 1rem;
        min-height: 0;
        height: 100%;
      }

      .calendar-day:hover {
        background: #222222;
        border-color: var(--dark-border);
      }
      
      a.calendar-day {
        cursor: pointer;
      }
      
      a.calendar-day:hover {
        color: #d4d4d4;
      }

      .calendar-day.other-month {
        color: var(--dark-text-muted);
        opacity: 0.5;
      }

      .calendar-day.today {
        background: #2a2a2a;
        color: #d4d4d4;
        font-weight: 600;
        border: 1px solid var(--dark-border);
      }

      .calendar-day.has-report {
        background: #10b981;
        color: white;
        font-weight: 600;
      }

      .calendar-day.has-report::after {
        content: "•";
        position: absolute;
        top: 2px;
        right: 4px;
        font-size: 1.1rem;
        color: #34d399;
      }

      .loading-spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #333333;
        border-radius: 50%;
        border-top-color: #d4d4d4;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.9rem;
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: 500;
      }

      .status-available {
        background: #10b981;
        color: white;
      }

      .status-checking {
        background: #1a1a1a;
        color: #fbbf24;
        border: 1px solid var(--dark-border);
      }

      .status-unavailable {
        background: #1a1a1a;
        color: #f87171;
        border: 1px solid var(--dark-border);
      }

      @media (max-width: 768px) {
        .header-title {
          font-size: 1.2rem;
        }
        .main-container {
          padding: 8px;
        }
        .header-bar {
          padding: 8px 12px;
          margin-bottom: 8px;
        }
        .calendar-section {
          padding: 8px;
        }
        .calendar-nav {
          gap: 8px;
        }
        .month-year {
          font-size: 1.1rem;
          min-width: 130px;
        }
        .yesterday-icon {
          padding: 6px 10px;
          font-size: 0.9rem;
        }
        .calendar-day {
          font-size: 0.9rem;
        }
      }

      /* Bootstrap overrides for dark theme */
      .text-muted {
        color: var(--dark-text-muted) !important;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="header-bar">
        <h1 class="header-title">
          <i class="fas fa-chart-line"></i> Stock Analysis
        </h1>
        <a href="#" id="yesterdayLink" class="yesterday-icon" target="_blank">
          <i class="fas fa-clock"></i>
          <span id="yesterdayText">Yesterday</span>
          <span id="yesterdayStatus" class="status-badge status-checking">
            <span class="loading-spinner"></span>
          </span>
        </a>
      </div>

      <div class="calendar-section">
        <div class="calendar-header">
          <div class="calendar-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">
              <i class="fas fa-chevron-left"></i>
            </button>
            <div class="month-year" id="monthYear"></div>
            <button class="nav-btn" onclick="changeMonth(1)">
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </div>

    <script>
      class ConcallReportNavigator {
        constructor() {
          this.currentDate = new Date();
          this.reportCache = new Map();
          this.githubApiBase =
            "https://api.github.com/repos/eldhoz515/stock-analysis/contents/concalls";
          this.githubPagesBase =
            "https://eldhoz515.github.io/stock-analysis/concalls";

          this.init();
        }

        async init() {
          await this.loadAvailableReports();
          await this.checkYesterdayReport();
        }

        async checkYesterdayReport() {
          const link = document.getElementById("yesterdayLink");
          const status = document.getElementById("yesterdayStatus");

          try {
            const available = await this.isReportAvailable("yesterday.html");
            
            if (available) {
              link.href = `${this.githubPagesBase}/yesterday.html`;
              status.className = "status-badge status-available";
              status.innerHTML = '<i class="fas fa-check"></i>';
            } else {
              status.className = "status-badge status-unavailable";
              status.innerHTML = '<i class="fas fa-times"></i>';
              link.style.opacity = "0.6";
              link.style.pointerEvents = "none";
            }
          } catch (error) {
            status.className = "status-badge status-unavailable";
            status.innerHTML = '<i class="fas fa-exclamation"></i>';
            console.error("Error checking yesterday report:", error);
          }
        }

        async loadAvailableReports() {
          try {
            const response = await fetch(this.githubApiBase);
            const files = await response.json();

            if (Array.isArray(files)) {
              files.forEach((file) => {
                // Handle date-specific reports
                if (
                  file.name.match(/\d{4}-\d{2}-\d{2}_\d{4}-\d{2}-\d{2}\.html/)
                ) {
                  const dates = file.name.replace(".html", "").split("_");
                  if (dates.length === 2) {
                    this.reportCache.set(dates[0], {
                      filename: file.name,
                      url: `${this.githubPagesBase}/${file.name}`,
                      startDate: dates[0],
                      endDate: dates[1],
                    });
                  }
                }
              });

              this.renderCalendar();
            }
          } catch (error) {
            console.error("Error loading reports:", error);
          }
        }

        async isReportAvailable(filename) {
          try {
            const response = await fetch(`${this.githubApiBase}/${filename}`);
            return response.ok;
          } catch (error) {
            return false;
          }
        }

        renderCalendar() {
          const year = this.currentDate.getFullYear();
          const month = this.currentDate.getMonth();

          document.getElementById("monthYear").textContent = new Date(
            year,
            month,
          ).toLocaleDateString("en-US", {
            month: "long",
            year: "numeric",
          });

          const grid = document.getElementById("calendarGrid");
          grid.innerHTML = "";

          // Day headers
          const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
          days.forEach((day) => {
            const dayHeader = document.createElement("div");
            dayHeader.className = "calendar-day-header";
            dayHeader.textContent = day;
            grid.appendChild(dayHeader);
          });

          // Get first day of month and number of days
          const firstDay = new Date(year, month, 1).getDay();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const daysInPrevMonth = new Date(year, month, 0).getDate();

          // Previous month's trailing days
          for (let i = firstDay - 1; i >= 0; i--) {
            const day = document.createElement("div");
            day.className = "calendar-day other-month";
            day.textContent = daysInPrevMonth - i;
            grid.appendChild(day);
          }

          // Current month's days
          for (let date = 1; date <= daysInMonth; date++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(date).padStart(2, "0")}`;
            const today = new Date().toISOString().split("T")[0];
            const hasReport = this.reportCache.has(dateStr);
            
            if (hasReport) {
              const report = this.reportCache.get(dateStr);
              const link = document.createElement("a");
              link.href = report.url;
              link.className = "calendar-day has-report";
              link.textContent = date;
              
              if (dateStr === today) {
                link.classList.add("today");
              }
              
              grid.appendChild(link);
            } else {
              const day = document.createElement("div");
              day.className = "calendar-day";
              day.textContent = date;
              
              if (dateStr === today) {
                day.classList.add("today");
              }
              
              grid.appendChild(day);
            }
          }

          // Next month's leading days (always show 6 weeks for consistent layout)
          const totalCells = grid.children.length - 7; // Subtract headers
          const maxCells = 42; // 6 weeks * 7 days
          const remainingCells = maxCells - totalCells;
          for (let date = 1; date <= remainingCells; date++) {
            const day = document.createElement("div");
            day.className = "calendar-day other-month";
            day.textContent = date;
            grid.appendChild(day);
          }
        }


      }

      function changeMonth(delta) {
        navigator.currentDate.setMonth(
          navigator.currentDate.getMonth() + delta,
        );
        navigator.renderCalendar();
      }

      // Initialize the navigator when the page loads
      let navigator;
      document.addEventListener("DOMContentLoaded", () => {
        navigator = new ConcallReportNavigator();
      });
    </script>
  </body>
</html>
